name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, simplexml

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Mago
        # Version gepinnt: der Installer holt "latest" sonst über die anonyme
        # GitHub-API (Rate-Limit auf Runner-IPs) und neue Mago-Releases können
        # neue Regeln einführen. GH_TOKEN: der Installer verifiziert die Build-
        # Attestation via vorinstalliertem `gh`, das auf Runnern ein Token braucht.
        run: curl --proto '=https' --tlsv1.2 -sSf https://carthage.software/mago.sh | bash -s -- --version=1.42.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check formatting
        run: mago fmt --check

      - name: Run linter
        run: mago lint

      - name: Run static analysis
        run: mago analyze
